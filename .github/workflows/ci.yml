name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reservas
          POSTGRES_PASSWORD: reservas
          POSTGRES_DB: reservas_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reservas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # La app usa el rol reservas_app (RLS); las migraciones, el propietario.
      DATABASE_URL: postgresql://reservas_app:reservas_app@localhost:5432/reservas_dev
      MIGRATION_DATABASE_URL: postgresql://reservas:reservas@localhost:5432/reservas_dev
      TEST_DATABASE_URL: postgresql://reservas:reservas@localhost:5432/reservas_test
      SHADOW_DATABASE_URL: postgresql://reservas:reservas@localhost:5432/reservas_shadow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Crear BDs de test y sombra
        run: |
          PGPASSWORD=reservas psql -h localhost -U reservas -d reservas_dev -c 'CREATE DATABASE reservas_test' -c 'CREATE DATABASE reservas_shadow' -c "CREATE ROLE reservas_app LOGIN PASSWORD 'reservas_app'"
      - run: npm ci
      - name: Dependencias sin vulnerabilidades altas
        run: npm audit --audit-level=high
      - name: Chromium para las pruebas de punta a punta de la página generada
        run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:check-drift
      - name: Build del panel (lo necesitan las pruebas del panel en el navegador)
        run: npm run build
      - name: Tests con cobertura mínima
        run: npm run test:coverage
      - name: Tests con el servidor en otra zona horaria (UTC+14)
        run: npm test
        env:
          TZ: Pacific/Kiritimati
      - name: Migraciones desde cero (como en producción)
        run: npm run db:deploy -w apps/api

  docker:
    # La imagen de producción, probada como en Railway: pre-deploy (`migrate` crea reservas_app y migra
    # con el propietario superusuario), servidor, alta del primer negocio desde /operator.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: railway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OWNER_URL: postgresql://postgres:postgres@127.0.0.1:5432/railway
      APP_URL: postgresql://reservas_app:clave-de-la-app-en-ci-1234@127.0.0.1:5432/railway
      OPERATOR_TOKEN: token-de-operador-en-ci-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t reservas .
      - name: Pre-deploy (crea reservas_app y migra); repetirlo no cambia nada
        run: |
          docker run --rm --network host -e MIGRATION_DATABASE_URL="$OWNER_URL" -e DATABASE_URL="$APP_URL" reservas migrate | tee migrate.log
          grep -q 'reservas_app: creado' migrate.log
          docker run --rm --network host -e MIGRATION_DATABASE_URL="$OWNER_URL" -e DATABASE_URL="$APP_URL" reservas migrate | grep -q 'No pending migrations'
      - name: Servidor en producción y primer negocio desde /operator
        run: |
          docker run -d --name api --network host -e DATABASE_URL="$APP_URL" -e MIGRATION_DATABASE_URL="$OWNER_URL" \
            -e OPERATOR_TOKEN="$OPERATOR_TOKEN" reservas
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && break
            sleep 1
          done
          docker inspect -f '{{.State.Health.Status}}' api | grep -qx healthy
          curl -fsS localhost:3000/operator | grep -q 'action="/operator/tenants"'
          curl -sS -o created.html -w '%{http_code}' \
            -d "token=$OPERATOR_TOKEN&name=Humo&slug=barberia-humo&adminEmail=dono%40humo.test&timezone=America%2FSao_Paulo&country=55&currency=BRL&locale=pt-BR&location=Centro" \
            localhost:3000/operator/tenants | grep -qx 201
          PASSWORD=$(grep -o 'Contraseña inicial: <code>[^<]*' created.html | sed 's/.*<code>//')
          test -n "$PASSWORD"
          curl -fsS localhost:3000/api/v1/public/barberia-humo | grep -q '"slug":"barberia-humo"'
          curl -fsS -D - -o /dev/null -H 'content-type: application/json' \
            -d "{\"tenantSlug\":\"barberia-humo\",\"email\":\"dono@humo.test\",\"password\":\"$PASSWORD\"}" \
            localhost:3000/api/v1/auth/login | grep -qi 'set-cookie: sid=.*Secure'
          curl -fsS -H 'accept: text/html' localhost:3000/agenda | grep -q '<div id="root">'
          docker stop api
          test "$(docker inspect -f '{{.State.ExitCode}}' api)" = 0
      - name: Se niega a arrancar conectado como propietario (sin RLS)
        run: |
          if docker run --rm --network host -e DATABASE_URL="$OWNER_URL" -e PORT=3001 reservas; then exit 1; fi
      - name: Logs del servidor
        if: failure()
        run: docker logs api || true
