# PostgreSQL para desarrollo y tests. En producción se usa un PostgreSQL gestionado (ver docs).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
      POSTGRES_DB: reservas_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas_dev"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
